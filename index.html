<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EasyDial Bêta</title>
<meta name="theme-color" content="#3167f4">
<meta name="description" content="EasyDial bêta - une personne, tous ses canaux.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--b:#3167f4;--ink:#14213c;--mut:#7c879b;--bg:#f2f5fb;--line:#e3e9f2;--green:#20b65a;--orange:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:#dfe7f5;font-family:Arial,sans-serif;color:var(--ink)}#app{max-width:430px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:76px}header{background:white;position:sticky;top:0;z-index:10;padding:14px 15px 11px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900;color:var(--b)}.beta{font-size:10px;background:#eaf0ff;color:var(--b);padding:5px 8px;border-radius:20px}.search{margin-top:10px;background:#f1f4f8;border-radius:14px;padding:11px;color:#7e8899}.screen{display:none;padding:13px}.show{display:block}.title{font-size:19px;font-weight:850;margin:5px 2px 12px}.card{background:#fff;border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:0 2px 12px #7790bd12}.person{display:flex;gap:11px;align-items:center}.avatar{width:50px;height:50px;border-radius:50%;background:center/cover no-repeat #dfe8ff;flex:none;border:2px solid #fff;box-shadow:0 1px 5px #7484a433;position:relative}.unread{position:absolute;right:-3px;top:-3px;background:var(--red);color:#fff;min-width:18px;height:18px;border-radius:10px;font-size:10px;display:grid;place-items:center;border:2px solid white}.grow{flex:1;min-width:0}.name{font-weight:800}.small{font-size:12px;color:var(--mut);margin-top:4px}.time{font-size:10px;color:#9aa4b4}.logos{display:flex;gap:5px;margin-top:6px}.ci{width:18px;height:18px;border-radius:5px;object-fit:contain}.star{font-size:19px;color:#f3b51b;margin-right:5px}.head{display:flex;align-items:center;gap:10px}.back,.info{border:0;background:#fff;border-radius:12px;padding:8px 11px;font-size:20px}.summary{font-size:12px;line-height:1.4;background:#e9efff;border:1px solid #d5dfff;padding:11px;border-radius:15px;margin:10px 0}.timeline{padding-bottom:115px}.bubble{max-width:88%;background:#fff;border-radius:17px;padding:10px 11px;margin:8px 0;box-shadow:0 1px 5px #7890bd12}.bubble.me{margin-left:auto;background:#dfe9ff}.source{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:bold}.body{font-size:13px;line-height:1.4;margin-top:5px}.when{font-size:9px;color:#9aa4b5;margin-top:6px}.file{margin-top:7px;background:#f3f5f9;padding:9px;border-radius:10px;font-size:12px;font-weight:bold}.callmiss{border-left:4px solid var(--red)}.composer{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid var(--line);padding:8px 10px;z-index:8}.channels{display:flex;gap:8px;margin-bottom:7px}.ch{border:2px solid transparent;background:#f3f5f9;border-radius:10px;padding:5px;display:grid;place-items:center}.ch.sel{border-color:var(--b);background:#eaf0ff}.ch img{width:22px;height:22px}.write{display:flex;gap:7px}.write input{flex:1;min-width:0;border:1px solid var(--line);border-radius:15px;padding:11px}.attach,.send{border:0;border-radius:13px;padding:0 12px;font-size:18px}.attach{background:#eef2f8}.send{background:var(--b);color:#fff}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:11px}.filter{white-space:nowrap;border:0;background:white;border-radius:99px;padding:8px 11px;color:#66728a}.filter.sel{background:var(--b);color:white}.prohero{background:linear-gradient(135deg,#172951,#3167f4);color:white;border-radius:20px;padding:17px;margin-bottom:12px}.task{display:flex;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:5px}.done{opacity:.45}.done .dot{background:var(--green)}.btn{border:0;border-radius:12px;padding:9px 11px;background:var(--b);color:white;font-weight:bold;margin-top:8px}.btn2{background:#eef2f8;color:#46536c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#f5f7fb;border-radius:12px;padding:10px;font-size:11px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.pic{aspect-ratio:1;background:linear-gradient(135deg,#dce5f6,#bfcdeb);border-radius:10px;display:grid;place-items:center;font-size:24px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.quick .card{text-align:center;padding:10px 5px}.big{font-size:20px;font-weight:900;color:var(--b)}.toast{position:fixed;bottom:125px;left:50%;transform:translateX(-50%);background:#17213a;color:white;padding:10px 14px;border-radius:12px;display:none;z-index:30;font-size:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#fff;display:flex;border-top:1px solid var(--line);z-index:12;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border:0;background:#fff;padding:9px 2px;color:#7d8799;font-size:10px}nav button.on{color:var(--b);font-weight:bold}.ico{display:block;font-size:19px;margin-bottom:2px}
</style></head><body><div id="app"><header><div class="top"><div class="logo">EasyDial</div><div class="beta">BÊTA V4</div></div><div class="search" onclick="go('search')">🔎 Retrouver n'importe quoi…</div></header>
<section id="home" class="screen show"><div class="quick"><div class="card"><div class="big" id="qUnread">0</div><div class="small">Non lus</div></div><div class="card" onclick="go('pro')"><div class="big" id="qTasks">0</div><div class="small">À traiter</div></div><div class="card"><div class="big">2</div><div class="small">Appels</div></div></div><div class="filters"><button class="filter sel" onclick="filterPeople('all',this)">Tous</button><button class="filter" onclick="filterPeople('fav',this)">⭐ Favoris</button><button class="filter" onclick="filterPeople('unread',this)">Non lus</button></div><div id="people"></div></section>
<section id="thread" class="screen"><div class="head"><button class="back" onclick="go('home')">‹</button><div id="headAvatar" class="avatar"></div><div class="grow"><div id="tname" class="name"></div><div class="small">Une personne · tous ses canaux</div></div><button class="info" onclick="toggleFav()">☆</button><button class="info" onclick="go('profile')">ⓘ</button></div><div id="summary"></div><div id="timeline" class="timeline"></div><div class="composer"><div id="channels" class="channels"></div><div class="write"><button class="attach" onclick="attach()">＋</button><input id="message" placeholder="Écrire à cette personne…"><button class="send" onclick="send()">➤</button></div></div></section>
<section id="profile" class="screen"><div class="head"><button class="back" onclick="go('thread')">‹</button><div class="title" style="margin:0">Fiche contact</div></div><div id="profileBox"></div></section>
<section id="search" class="screen"><div class="title">Recherche universelle</div><div class="card"><input id="q" oninput="findAll()" placeholder="devis, photo, Golf 8, dimensions…" style="width:100%;border:0;outline:0;font-size:15px;padding:7px"></div><div id="results"><div class="small" style="text-align:center">Essaie « devis », « photo » ou « Golf 8 ».</div></div></section>
<section id="pro" class="screen"><div class="prohero"><b>À traiter</b><div class="small" style="color:#dce6ff">EasyDial transforme les échanges importants en actions. Tu gardes la décision.</div></div><div id="tasks"></div></section>
<nav><button class="on" onclick="go('home',this)"><span class="ico">💬</span>Personnes</button><button onclick="go('search',this)"><span class="ico">🔎</span>Recherche</button><button onclick="go('pro',this)"><span class="ico">✅</span>À traiter</button><button onclick="toastMsg('Profil bêta à venir')"><span class="ico">⚙️</span>Profil</button></nav><div id="toast" class="toast"></div></div>
<script>
const icons={"WhatsApp":"https://cdn.simpleicons.org/whatsapp/25D366","SMS":"https://cdn.simpleicons.org/googlemessages/246BFD","E-mail":"https://cdn.simpleicons.org/gmail/EA4335","Messenger":"https://cdn.simpleicons.org/messenger/0866FF","Instagram":"https://cdn.simpleicons.org/instagram/E4405F","Appel":"https://cdn.simpleicons.org/googlevoice/4285F4"};
const P=[
{name:"Jean Dupont",photo:"https://i.pravatar.cc/120?img=12",phone:"06 12 34 56 78",email:"jean.dupont@email.fr",note:"Client vitrophanie",fav:true,unread:2,channels:["WhatsApp","SMS","E-mail"],summary:"Jean attend la modification de son devis. Les nouvelles dimensions sont arrivées par SMS.",events:[{c:"WhatsApp",t:"Bonjour, vous pouvez me refaire le devis avec les nouvelles dimensions ?",w:"Aujourd’hui · 09:42",action:true},{c:"Appel",t:"Appel entrant · 3 min 42",w:"Aujourd’hui · 10:17"},{c:"SMS",t:"Nouvelles dimensions : 142 × 95 cm et 86 × 210 cm.",w:"Aujourd’hui · 11:03"},{c:"E-mail",t:"Voici le devis précédent.",file:"Devis_Jean_Dupont.pdf · 485 €",w:"Hier · 18:26"}],pics:2},
{name:"Marc Bernard",photo:"https://i.pravatar.cc/120?img=14",phone:"06 45 21 89 10",email:"marc@email.fr",note:"Prospect · Golf 8",fav:false,unread:1,channels:["SMS"],summary:"Marc souhaite un tarif vitres teintées sur Golf 8 et préfère être rappelé après 17 h.",events:[{c:"Appel",t:"Appel manqué · demande tarif vitres teintées Golf 8.",w:"Aujourd’hui · 12:14",miss:true,action:true},{c:"SMS",t:"Bonjour, vous pouvez me rappeler après 17 h ?",w:"Aujourd’hui · 12:17"}],pics:1},
{name:"Sophie Martin",photo:"https://i.pravatar.cc/120?img=47",phone:"06 77 55 33 22",email:"sophie@email.fr",note:"Cliente",fav:true,unread:0,channels:["Messenger","SMS"],summary:"Sophie doit confirmer son projet.",events:[{c:"Messenger",t:"Merci, je vous confirme ça ce soir.",w:"Hier · 19:31",action:true},{c:"SMS",t:"Je vous envoie une photo demain.",w:"Hier · 20:02"}],pics:3},
{name:"Thomas Leroy",photo:"https://i.pravatar.cc/120?img=33",phone:"06 88 12 90 31",email:"thomas@email.fr",note:"Contact",fav:false,unread:0,channels:["Instagram"],summary:"Échanges Instagram liés à son projet.",events:[{c:"Instagram",t:"Photo reçue pour le projet.",file:"photo_projet.jpg",w:"Lundi · 16:40"}],pics:4}];
let current=0,selected="WhatsApp",tasks=[{p:0,t:"Modifier le devis avec les nouvelles dimensions.",done:false},{p:1,t:"Rappeler pour tarif vitres teintées Golf 8.",done:false},{p:2,t:"Répondre concernant le délai.",done:false}];
const im=c=>icons[c]?`<img class="ci" src="${icons[c]}" alt="${c}">`:"";
function updateCounts(){qUnread.textContent=P.reduce((a,p)=>a+p.unread,0);qTasks.textContent=tasks.filter(x=>!x.done).length}
function renderPeople(mode="all"){let arr=P.map((p,i)=>({p,i})).filter(x=>mode==="all"||mode==="fav"&&x.p.fav||mode==="unread"&&x.p.unread);people.innerHTML=arr.map(({p,i})=>`<div class="card person" onclick="openPerson(${i})"><div class="avatar" style="background-image:url('${p.photo}')">${p.unread?`<span class="unread">${p.unread}</span>`:""}</div><div class="grow"><div class="name">${p.fav?'<span class="star">★</span>':""}${p.name}</div><div class="small">${p.events[0].t}</div><div class="logos">${p.channels.map(im).join("")}</div></div><div class="time">${p.events[0].w.split("·")[0]}</div></div>`).join("")}
function filterPeople(m,b){document.querySelectorAll(".filter").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");renderPeople(m)}
function go(id,b){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("show"));document.getElementById(id).classList.add("show");if(b){document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}if(id==="profile")renderProfile();if(id==="pro")renderTasks();if(id==="home"){renderPeople();updateCounts()}scrollTo(0,0)}
function openPerson(i){current=i;P[i].unread=0;selected=P[i].channels[0]||"SMS";renderThread();updateCounts();go("thread")}
function renderThread(){let p=P[current];tname.textContent=p.name;headAvatar.style.backgroundImage=`url('${p.photo}')`;summary.innerHTML=`<div class="summary"><b>Résumé EasyDial</b><br>${p.summary}</div>`;timeline.innerHTML=p.events.slice().reverse().map((e,j)=>`<div id="ev-${current}-${p.events.length-1-j}" class="bubble ${e.me?"me":""} ${e.miss?"callmiss":""}"><div class="source">${im(e.c)}${e.c}${e.miss?" · APPEL MANQUÉ":""}</div><div class="body">${e.t}</div>${e.file?`<div class="file">📎 ${e.file}</div>`:""}<div class="when">${e.w}</div>${e.action?`<button class="btn btn2" onclick="addTask(${current},'${e.t.replace(/'/g,"")}')">＋ À traiter</button>`:""}</div>`).join("");channels.innerHTML=p.channels.map(c=>`<button class="ch ${c===selected?"sel":""}" onclick="choose('${c}')">${im(c)}</button>`).join("")}
function choose(c){selected=c;renderThread()}function send(){let v=message.value.trim();if(!v)return;P[current].events.unshift({c:selected,t:v,w:"À l’instant · simulation",me:true});message.value="";renderThread();toastMsg("Envoyé via "+selected)}function attach(){P[current].events.unshift({c:selected,t:"Pièce jointe envoyée",file:"nouveau_document.jpg · simulation",w:"À l’instant",me:true});P[current].pics++;renderThread();toastMsg("Pièce jointe ajoutée")}
function toggleFav(){P[current].fav=!P[current].fav;toastMsg(P[current].fav?"Ajouté aux favoris":"Retiré des favoris")}
function renderProfile(){let p=P[current];profileBox.innerHTML=`<div class="card person"><div class="avatar" style="background-image:url('${p.photo}')"></div><div><div class="name">${p.name}</div><div class="small">${p.note}</div></div></div><div class="card"><div class="grid"><div class="mini"><b>Téléphone</b><br>${p.phone}</div><div class="mini"><b>E-mail</b><br>${p.email}</div><div class="mini"><b>Canaux</b><div class="logos">${p.channels.map(im).join("")}</div></div><div class="mini"><b>Historique</b><br>${p.events.length} événements</div></div></div><div class="card"><b>Photos</b><div class="gallery">${Array.from({length:p.pics},(_,i)=>`<div class="pic">🖼️</div>`).join("")}</div></div><div class="card"><b>Documents</b><div class="small">${p.events.filter(e=>e.file).map(e=>"📎 "+e.file).join("<br>")||"Aucun document."}</div></div>`}
function addTask(pi,t){if(!tasks.some(x=>x.p===pi&&x.t===t&&!x.done))tasks.unshift({p:pi,t,done:false});updateCounts();toastMsg("Ajouté à À traiter")}
function renderTasks(){updateCounts();tasksEl.innerHTML=tasks.map((x,i)=>`<div class="card task ${x.done?"done":""}"><div class="dot"></div><div class="grow"><b>${P[x.p].name}</b><div class="small">${x.t}</div><button class="btn btn2" onclick="openPerson(${x.p})">Conversation</button>${!x.done?` <button class="btn" onclick="doneTask(${i})">Traité</button>`:""}</div></div>`).join("")}const tasksEl=document.getElementById("tasks");function doneTask(i){tasks[i].done=true;renderTasks();toastMsg("Demande traitée")}
function findAll(){let q=document.getElementById("q").value.toLowerCase().trim(),hits=[];if(q.length<2){results.innerHTML='<div class="small" style="text-align:center">Tape au moins 2 caractères.</div>';return}P.forEach((p,pi)=>p.events.forEach((e,ei)=>{if((p.name+" "+e.t+" "+(e.file||"")+" "+e.c).toLowerCase().includes(q))hits.push({p,pi,e,ei})}));results.innerHTML=hits.length?hits.map(h=>`<div class="card" onclick="jump(${h.pi},${h.ei})"><b>${h.p.name}</b><div class="small">${im(h.e.c)} ${h.e.c} · ${h.e.w}</div><div class="body">${h.e.t}${h.e.file?`<br><b>📎 ${h.e.file}</b>`:""}</div><div class="small">Ouvrir au bon endroit →</div></div>`).join(""):'<div class="small" style="text-align:center">Aucun résultat.</div>'}
function jump(pi,ei){current=pi;selected=P[pi].channels[0]||"SMS";renderThread();go("thread");setTimeout(()=>{let e=document.getElementById(`ev-${pi}-${ei}`);if(e){e.scrollIntoView({behavior:"smooth",block:"center"});e.style.outline="2px solid #3167f4";setTimeout(()=>e.style.outline="",1800)}},80)}
function toastMsg(t){toast.textContent=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",1700)}
renderPeople();updateCounts();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
if(!localStorage.getItem("easydial_seen_intro")){
 setTimeout(()=>{alert("Bienvenue sur EasyDial 👋\n\nLe principe : une personne = un seul fil, même si elle te contacte par plusieurs canaux.\n\nTeste la recherche avec « devis », ouvre Jean Dupont, puis regarde « À traiter ».");localStorage.setItem("easydial_seen_intro","1")},350);
}
</script>
<script>
/* EasyDial V5 local engine */
const EDKEY="easydial_v5_local";
function edLoad(){try{return JSON.parse(localStorage.getItem(EDKEY))||{contacts:[],notes:[],tasks:[]}}catch(e){return {contacts:[],notes:[],tasks:[]}}}
function edSave(d){localStorage.setItem(EDKEY,JSON.stringify(d))}
function edAddContact(){
 const name=prompt("Nom du contact :"); if(!name)return;
 const phone=prompt("Téléphone (facultatif) :")||"";
 const email=prompt("E-mail (facultatif) :")||"";
 const d=edLoad(); d.contacts.push({id:Date.now(),name,phone,email,created:new Date().toISOString()}); edSave(d);
 alert(name+" a été enregistré sur ce téléphone.");
}
function edAddNote(){
 const who=prompt("Contact / client :"); if(!who)return;
 const note=prompt("Note :"); if(!note)return;
 const d=edLoad(); d.notes.push({id:Date.now(),who,note,created:new Date().toISOString()}); edSave(d);
 alert("Note enregistrée.");
}
function edAddTask(){
 const task=prompt("À traiter :"); if(!task)return;
 const d=edLoad(); d.tasks.push({id:Date.now(),task,done:false,created:new Date().toISOString()}); edSave(d);
 alert("Ajouté à À traiter.");
}
function edSearch(){
 const q=(prompt("Recherche EasyDial :")||"").trim().toLowerCase(); if(!q)return;
 const d=edLoad(), out=[];
 d.contacts.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))out.push("👤 "+x.name+" "+(x.phone||"")+" "+(x.email||""))});
 d.notes.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))out.push("📝 "+x.who+" : "+x.note)});
 d.tasks.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))out.push("✓ "+x.task)});
 alert(out.length?out.join("\n\n"):"Aucun résultat enregistré localement.");
}
function edPanel(){
 const d=edLoad();
 alert("Moteur local EasyDial V5\n\nContacts enregistrés : "+d.contacts.length+
       "\nNotes : "+d.notes.length+"\nÀ traiter : "+d.tasks.filter(x=>!x.done).length+
       "\n\nLes données restent sur ce téléphone.");
}

</script>


<script>
window.addEventListener("load",()=>{
  const host=document.querySelector("header") || document.querySelector("#app") || document.body;
  if(!host || document.getElementById("ed-v5-menu")) return;
  const box=document.createElement("div");
  box.id="ed-v5-menu";
  box.innerHTML='<button onclick="edAddContact()">＋ Contact</button><button onclick="edAddNote()">＋ Note</button><button onclick="edAddTask()">＋ À traiter</button><button onclick="edSearch()">⌕ Recherche</button>';
  Object.assign(box.style,{display:"flex",gap:"6px",overflowX:"auto",padding:"8px 12px",background:"#fff"});
  [...box.querySelectorAll("button")].forEach(b=>Object.assign(b.style,{border:"0",borderRadius:"10px",padding:"8px 10px",fontWeight:"700",whiteSpace:"nowrap",background:"#eef4ff",color:"#14234d"}));
  if(host.tagName==="HEADER") host.insertAdjacentElement("afterend",box); else host.insertAdjacentElement("afterbegin",box);
});
</script>

</body></html>
